[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragforge"
version = "0.1.0"
description = "RAG library (naive to agentic, graph, SQL, multimodal) plus a multi-tenant RAG-as-a-service API"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pypdf>=4.0"]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ragforge = "ragforge.cli:main"

[tool.setuptools.packages.find]
include = ["ragforge*"]

[tool.setuptools.package-data]
"ragforge.platform" = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
