services:
  - type: web
    name: ragforge
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: RAGFORGE_DATA
        value: /data
      - key: RAGFORGE_ADMIN_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: ragforge-data
      mountPath: /data
      sizeGB: 1
